appId: com.matthewtheriault.martbox
productName: MartBox
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/ffprobe-static/**'
extraResources:
  - from: build/icon.png
    to: icon.png
afterPack: scripts/afterPackSidecar.js
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.entertainment
linux:
  target:
    - AppImage
    - deb
  category: Video
